# SPDX-License-Identifier: MIT

[package]
name = "hello-world-ta"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[package.metadata.optee.ta]
uuid-path = "uuid.txt"

[dependencies]
optee-utee = { workspace = true }
optee-utee-sys = { workspace = true }

[build-dependencies]
optee-utee-build = { workspace = true }

# The `std` feature enables std-mode builds (requires nightly + `-Z build-std`).
# Without it, the crate compiles with `no_std` for TA execution in the TEE.
[features]
default = []
std = []
